<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi persona favorita ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #fffaf0;
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 25px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #ffe4e1;
        }
        h2 {
            color: #d86b7d;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        p {
            margin-bottom: 20px;
            font-size: 1.05rem;
            line-height: 1.4;
        }
        .btn-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #fff0f3;
            border: 2px solid #ffccd5;
            border-radius: 12px;
            color: #c9184a;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-option:active {
            transform: scale(0.98);
            background-color: #ffccd5;
        }
        .hidden {
            display: none;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 177.78%; /* Proporción 9:16 vertical para celulares */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
